<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ERP Simulator</title>
  <!-- Google Fonts Outfit & Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <!-- Google Material Symbols Outlined -->
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet" />
  <!-- SheetJS Library for Excel operations in browser -->
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
  <!-- Stylesheet -->
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Background decorative glows for high-end stylistic theme -->
  <div class="glow-bg-blob glow-blob-1"></div>
  <div class="glow-bg-blob glow-blob-2"></div>

  <!-- Fiori Premium Shell Bar -->
  <header class="fiori-shell">
    <div class="shell-logo">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M12 2L2 7L12 12L22 7L12 2Z" fill="var(--primary)"/>
        <path d="M2 17L12 22L22 17" stroke="var(--primary-dark)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        <path d="M2 12L12 17L22 12" stroke="var(--primary)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      <span>ERP Simulator</span>
    </div>
    
    <div class="shell-actions">
      <button class="btn-secondary" id="btn-theme-toggle" title="Toggle Theme" style="padding: 8px 12px; display: flex; align-items: center; justify-content: center;">
        <span class="material-symbols-outlined" style="margin-right: 0;">dark_mode</span>
      </button>
      <button class="btn-secondary" id="btn-show-dashboard">
        <span class="material-symbols-outlined">dashboard</span>
        <span>Dashboard</span>
      </button>
      
      <!-- Export Dropdown / Controls -->
      <button class="btn-secondary" id="btn-export-excel">
        <span class="material-symbols-outlined">table_chart</span>
        <span>Export Excel</span>
      </button>
      <button class="btn-secondary" id="btn-export-json">
        <span class="material-symbols-outlined">code</span>
        <span>Export JSON</span>
      </button>
      
      <button class="btn-secondary" id="btn-import-trigger">
        <span class="material-symbols-outlined">upload_file</span>
        <span>Import File</span>
      </button>
      <input type="file" id="file-import" style="display: none;" accept=".json,.xlsx,.xls">
      
      <button class="btn-secondary btn-reset" id="btn-reset-data">
        <span class="material-symbols-outlined">restart_alt</span>
        <span>Reset</span>
      </button>
    </div>
  </header>

  <div class="app-container">
    
    <!-- Sidebar Navigation -->
    <aside class="sidebar">
      <div class="sidebar-header">
        <div class="student-setup">
          <label for="student-id-input">Student 3-Digit ID (###)</label>
          <input type="text" id="student-id-input" class="input-id" maxlength="3" placeholder="000" value="000">
        </div>
      </div>
      
      <div id="steps-nav-container">
        <!-- Dynamic sidebar elements injected here by app.js -->
      </div>
    </aside>

    <!-- Main Content Area -->
    <main class="main-content" id="main-content-panel">
      <!-- Renders Dashboard or Steps dynamically -->
    </main>

  </div>

  <!-- Javascript Modules -->
  <script src="steps.js"></script>
  <script src="db.js"></script>
  <script src="app.js"></script>
</body>
</html>
